name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Линт/формат — быстрая джоба вне node-матрицы, без Java: падает за секунды,
  # держит планку стиля наравне с тестами (см. openspec spec ci-validation).
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npx biome ci .

  test:
    name: test (node ${{ matrix.node }})
    # runner пинован как страховка: layout считает Java-движок Smetana + вендорный
    # шрифт, поэтому эталон определяется мажором JDK (Temurin 21), а не окружением
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci --ignore-scripts

      # Golden-рендер идёт на пиновом managed-JRE (Temurin, см. jre.js TEMURIN_FEATURE),
      # а не на setup-java: тест подставляет его JAVA_HOME. Кешируем между прогонами,
      # ключ — от os/arch (feature=21 зашит в jre.js; при бампе обновить суффикс ключа).
      - name: Cache managed JRE
        uses: actions/cache@v4
        with:
          path: ~/.cache/c4builder/jre
          key: c4builder-jre-temurin21-${{ runner.os }}-${{ runner.arch }}

      # Прогрев кеша до тестов: сеть под контролем шага, таймауты сборок не тратятся
      # на скачивание. --force минует системную java (это и есть managed-JRE).
      - run: node index.js jre install --force

      - run: npm test

      # Нормализованный фактический выход сборки — из него регенерируется
      # эталон при расхождении окружений (см. test/README.md).
      # Пакуем в tar: upload-artifact дропает пустые файлы (напр. .nojekyll).
      - name: Pack actual output
        if: failure()
        run: tar -czf golden-actual.tar.gz -C test/.tmp actual

      - name: Upload actual output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actual-node${{ matrix.node }}
          path: golden-actual.tar.gz
          if-no-files-found: ignore
