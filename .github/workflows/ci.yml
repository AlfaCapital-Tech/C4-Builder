name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    # runner пинован: версия graphviz влияет на layout диаграмм и golden-эталон
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz

      - run: npm ci --ignore-scripts

      - run: npm test

      # Нормализованный фактический выход сборки — из него регенерируется
      # эталон при расхождении окружений (см. test/README.md)
      - name: Upload actual output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actual-node${{ matrix.node }}
          path: test/.tmp/actual/
          if-no-files-found: ignore
