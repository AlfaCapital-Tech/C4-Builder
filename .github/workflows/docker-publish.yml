name: Docker — сборка и публикация в GHCR

# Схема тегов (синхронна с npm dist-tags):
#   git-тег vX.Y.Z      → X.Y.Z + X.Y + latest   (стабильный релиз)
#   git-тег vX.Y.Z-rc.N → X.Y.Z-rc.N + rc        (пререлиз; latest не двигается)
#   push в master       → edge + sha-…           (последний dev-срез)
#   pull_request        → pr-N + sha-…           (сборки МР — для пина в тестовом CI)
#   workflow_dispatch   → <ветка> + sha-… (+ версионные теги из input version)
# Полные версии и sha-… неизменяемы; latest/rc/edge/pr-N/<ветка> — плавающие указатели.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'опционально: версия vX.Y.Z[-rc.N] для тегов образа; собирается код ТЕКУЩЕГО ref (ретро-публикация)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/c4builder

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Версия для версионных тегов: из git-тега v* либо из input (ретро-публикация).
      # Пустая строка = не релиз (master/PR/ветка) — версионные теги не назначаются.
      - name: Определить версию релиза
        id: ver
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ] && [ "${{ github.ref_type }}" = "tag" ]; then v="${{ github.ref_name }}"; fi
          if [ -n "$v" ] && ! echo "$v" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::некорректная версия: $v (ожидается vX.Y.Z[-suffix])"; exit 1
          fi
          case "$v" in *-*) pre=true ;; *) pre=false ;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

      - name: Авторизация в GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Buildx + gha-кеш слоёв: без него каждая сборка шла с нуля
      # (npm ci + apk в слоях не переиспользовались между прогонами).
      - name: Настроить Docker Buildx
        uses: docker/setup-buildx-action@v3

      # latest=false: latest назначаем явно и только на стабильный релиз —
      # авто-latest от metadata-action двигал бы его на каждый пуш в master.
      - name: Метаданные образа
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ver.outputs.version }},enable=${{ steps.ver.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ver.outputs.version }},enable=${{ steps.ver.outputs.version != '' && steps.ver.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.version != '' && steps.ver.outputs.prerelease == 'false' }}
            type=raw,value=rc,enable=${{ steps.ver.outputs.version != '' && steps.ver.outputs.prerelease == 'true' }}
            type=edge,branch=master
            type=ref,event=pr
            type=ref,event=branch,enable=${{ github.ref_name != 'master' }}
            type=sha

      # provenance выключен: single-platform образ без attestation-манифестов —
      # тег указывает прямо на манифест, а осиротевшие (сдвинутые pr-N/edge/rc)
      # остаются нетегированными и безопасно убираются docker-cleanup.yml.
      - name: Сборка и публикация
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
