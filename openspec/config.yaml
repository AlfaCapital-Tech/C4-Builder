schema: spec-driven

context: |
  c4builder — CLI (Node.js), собирает markdown + PlantUML в docsify-сайт / md.
  Сейчас CommonJS без тестов; идёт поэтапная модернизация: офлайн-шаблон
  (template = fixture тестов) → golden-тест+CI → удаление PDF-вывода →
  порт на TypeScript/ESM → рендер-фичи (java напрямую + Smetana,
  PNG через resvg, D2, экспериментальный TeaVM-движок).
  Главный потребитель — репо arch (108 .puml, C4-PlantUML stdlib, локальные
  .iuml-инклюды, кириллица, diagramFormat=svg, generateLocalImages=true):
  совместимость с его конфигом .c4builder — обязательный контракт.
  Работает в корпсреде без интернета: рендер только локальный (vendor JAR),
  онлайн-сервисы PlantUML не использовать.
  Артефакты OpenSpec пишем на русском; код и идентификаторы — на английском.

